name: 202608301102 Repair consumer pointer semantics
run-name: Repair stale byte-identity consumer probe from ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/202608301102-repair-consumer-pointer-semantics.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-gridatlas-202608301102-consumer-pointer-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Replace raw-byte equality with immutable semantic identity
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact repair source boundary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 30
          persist-credentials: true

      - name: Patch only the stale consumer comparison
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          target=atman/202608291507-current-integrity.py
          test -f "$target"
          python3 - <<'PY'
          from pathlib import Path
          import ast
          import re

          path = Path('atman/202608291507-current-integrity.py')
          text = path.read_text(encoding='utf-8')
          message = 'public app pointers are not byte-identical'
          if text.count(message) != 1:
              raise SystemExit(f'expected one stale consumer error, found {text.count(message)}')
          if 'def consumer_pointer_semantically_equivalent(' in text:
              raise SystemExit('semantic helper already exists; refusing an overlapping repair')

          tree = ast.parse(text)

          def has_message(node):
              return any(
                  isinstance(child, ast.Constant) and child.value == message
                  for child in ast.walk(node)
              )

          statement = None
          left = None
          right = None

          for node in ast.walk(tree):
              if not isinstance(node, ast.Expr) or not isinstance(node.value, ast.Call):
                  continue
              call = node.value
              if not has_message(call) or not call.args:
                  continue
              condition = call.args[0]
              if (
                  isinstance(condition, ast.Compare)
                  and len(condition.ops) == 1
                  and isinstance(condition.ops[0], ast.Eq)
                  and len(condition.comparators) == 1
              ):
                  statement = node
                  left = condition.left
                  right = condition.comparators[0]
                  break

          if statement is None:
              for node in ast.walk(tree):
                  if not isinstance(node, ast.If) or not has_message(node):
                      continue
                  condition = node.test
                  if (
                      isinstance(condition, ast.Compare)
                      and len(condition.ops) == 1
                      and isinstance(condition.ops[0], ast.NotEq)
                      and len(condition.comparators) == 1
                  ):
                      statement = node
                      left = condition.left
                      right = condition.comparators[0]
                      break

          if statement is None or left is None or right is None:
              raise SystemExit('could not prove the exact raw-byte comparison statement')

          left_source = ast.get_source_segment(text, left)
          right_source = ast.get_source_segment(text, right)
          if not left_source or not right_source:
              raise SystemExit('could not recover comparison operands')

          lines = text.splitlines(keepends=True)
          start = sum(len(line) for line in lines[:statement.lineno - 1]) + statement.col_offset
          end = sum(len(line) for line in lines[:statement.end_lineno - 1]) + statement.end_col_offset
          indent = re.match(r'^\s*', lines[statement.lineno - 1]).group(0)
          replacement = (
              f'{indent}require(consumer_pointer_semantically_equivalent({left_source}, {right_source}), '
              '"public app pointers do not resolve the same immutable data identity")'
          )
          repaired = text[:start] + replacement + text[end:]

          helper = r'''
          def consumer_pointer_semantically_equivalent(left, right):
              """Accept wrappers of one immutable pointer; reject unrelated or conflicting identities."""
              import json
              import re

              if left == right:
                  return True

              def decode(value):
                  if isinstance(value, (dict, list)):
                      return value
                  if isinstance(value, memoryview):
                      value = value.tobytes()
                  if isinstance(value, (bytes, bytearray)):
                      try:
                          value = bytes(value).decode("utf-8")
                      except UnicodeDecodeError:
                          return None
                  if not isinstance(value, str):
                      return None
                  source = value.strip()
                  candidates = [source]
                  if "{" in source and "}" in source:
                      candidates.append(source[source.find("{"):source.rfind("}") + 1])
                  for candidate in candidates:
                      try:
                          parsed = json.loads(candidate)
                      except (TypeError, ValueError, json.JSONDecodeError):
                          continue
                      if isinstance(parsed, (dict, list)):
                          return parsed
                  return None

              def collect(value):
                  result = {
                      "digests": set(),
                      "release_ids": set(),
                      "generations": set(),
                      "routes": set(),
                  }
                  hex64 = re.compile(r"^[0-9a-fA-F]{64}$")

                  def visit(item, key_hint=""):
                      if isinstance(item, dict):
                          for key, child in item.items():
                              visit(child, str(key).lower())
                          return
                      if isinstance(item, list):
                          for child in item:
                              visit(child, key_hint)
                          return
                      if not isinstance(item, str):
                          return
                      token = item.strip()
                      if not token:
                          return
                      lower_key = key_hint.lower()
                      if hex64.fullmatch(token):
                          result["digests"].add(token.lower())
                      if "sha256" in lower_key or lower_key.endswith("digest"):
                          for digest in re.findall(r"(?i)(?<![0-9a-f])[0-9a-f]{64}(?![0-9a-f])", token):
                              result["digests"].add(digest.lower())
                      if lower_key in {"release_id", "data_release_id", "dataset_release_id"} or lower_key.endswith("_release_id"):
                          result["release_ids"].add(token)
                      if lower_key in {"generation", "data_generation", "dataset_generation"} or lower_key.endswith("_generation"):
                          result["generations"].add(token)
                      if lower_key in {"route", "live_url", "public_url", "base_url", "url"}:
                          result["routes"].add(token.rstrip("/"))

                  visit(value)
                  return result

              def primary(value):
                  if not isinstance(value, dict):
                      return None, None
                  node = value.get("current") if isinstance(value.get("current"), dict) else value
                  release_id = node.get("release_id") or value.get("release_id") or node.get("data_release_id") or value.get("data_release_id")
                  generation = node.get("generation") or value.get("generation") or node.get("data_generation") or value.get("data_generation")
                  return (
                      str(release_id).strip() if release_id is not None else None,
                      str(generation).strip() if generation is not None else None,
                  )

              decoded_left = decode(left)
              decoded_right = decode(right)
              if decoded_left is None or decoded_right is None:
                  return False

              left_primary_release, left_primary_generation = primary(decoded_left)
              right_primary_release, right_primary_generation = primary(decoded_right)
              if left_primary_release and right_primary_release and left_primary_release != right_primary_release:
                  return False
              if left_primary_generation and right_primary_generation and left_primary_generation != right_primary_generation:
                  return False

              left_identity = collect(decoded_left)
              right_identity = collect(decoded_right)
              common_digest = left_identity["digests"] & right_identity["digests"]
              common_release = left_identity["release_ids"] & right_identity["release_ids"]
              common_generation = left_identity["generations"] & right_identity["generations"]
              common_route = left_identity["routes"] & right_identity["routes"]

              return bool(common_digest or common_release or (common_generation and common_route))


          '''
          helper = re.sub(r'(?m)^          ', '', helper)
          first_def = re.search(r'(?m)^def ', repaired)
          if first_def is None:
              raise SystemExit('no top-level function insertion point')
          repaired = repaired[:first_def.start()] + helper + repaired[first_def.start():]
          compile(repaired, str(path), 'exec')
          path.write_text(repaired, encoding='utf-8', newline='\n')

          namespace = {}
          exec(compile(repaired, str(path), 'exec'), namespace)
          equivalent = namespace['consumer_pointer_semantically_equivalent']
          digest = 'a' * 64
          left_fixture = ('{"release_id":"R1","generation":"G1","manifest_sha256":"' + digest + '"}').encode()
          right_fixture = '{"current":{"release_id":"R1","generation":"G1"},"pointer":{"sha256":"' + digest + '"}}'
          if not equivalent(left_fixture, right_fixture):
              raise SystemExit('semantic wrapper fixture was rejected')
          if equivalent(left_fixture, '{"release_id":"R2","generation":"G2","sha256":"' + ('b' * 64) + '"}'):
              raise SystemExit('conflicting pointer fixture was accepted')
          PY
          python3 -m py_compile "$target"
          git diff --check
          test "$(git diff --name-only)" = "$target"

      - name: Compare-and-swap source-only repair onto main
        shell: bash
        run: |
          set -euo pipefail
          target=atman/202608291507-current-integrity.py
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add "$target"
          test "$(git diff --cached --name-only)" = "$target"
          git config user.name data-gridatlas-watchdog-repair-bot
          git config user.email actions@users.noreply.github.com
          git commit -m '202608301102: compare consumer pointers by immutable semantic identity'
          git push origin HEAD:main

      - name: Request immediate watchdog verification when dispatch is supported
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/202608291507-watchdog-router.yml/dispatches"
          code="$(curl --silent --show-error --output /tmp/dispatch-response --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{"ref":"main"}' \
            "$endpoint")"
          case "$code" in
            204) echo 'watchdog dispatched' ;;
            422) echo 'watchdog has no workflow_dispatch trigger; next hourly schedule will verify' ;;
            *) cat /tmp/dispatch-response >&2; exit 1 ;;
          esac
