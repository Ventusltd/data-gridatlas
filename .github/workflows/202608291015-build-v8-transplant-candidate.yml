name: 202608291015 Build full V8 transplant candidate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact source commit to verify and build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: data-gridatlas-v8-transplant-202608291015
  cancel-in-progress: false

jobs:
  source_boundary:
    name: Verify exact source and transplant contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_source_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Enforce compare-and-swap source boundary
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha || github.sha }}
          EXECUTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$EXECUTED_WORKFLOW_SHA" = "$EXPECTED_SOURCE_SHA"
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Configure pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'

      - name: Install locked analytical engine
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Verify full source contract
        run: |
          mkdir -p work
          python atman/202608291015-verify-v8-transplant.py \
            --repository . \
            --output work/source-verification.json

  build_phase:
    name: Double-build ${{ matrix.phase }}
    needs: source_boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        phase:
          - p1_foundation
          - p2_lazy_context
          - p3_official_rebuild
          - p4_rail_global
          - p4_motorways
          - p4_trunk_roads
          - p4_primary_roads
          - quarantine
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_source_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Reassert exact main source
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha || github.sha }}
          EXECUTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$EXECUTED_WORKFLOW_SHA" = "$EXPECTED_SOURCE_SHA"
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SOURCE_SHA"

      - name: Configure pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'

      - name: Install locked analytical engine
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Bind exact hosted runtime image
        id: runtime
        run: |
          test "$(python -c 'import platform; print(platform.python_version())')" = '3.12.13'
          test -n "$ImageOS"
          test -n "$ImageVersion"
          printf '%s\n' "$ImageOS" "$ImageVersion" 'python-3.12.13' 'duckdb-1.3.2' \
            | sha256sum | awk '{print "fingerprint=" $1}' >> "$GITHUB_OUTPUT"

      - name: Restore exact content-addressed phase cache
        id: phase_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            build-cache/${{ matrix.phase }}
            build-evidence/${{ matrix.phase }}
          key: v8-transplant-202608291015-py31213-ubuntu24-${{ steps.runtime.outputs.fingerprint }}-${{ matrix.phase }}-${{ hashFiles('.github/workflows/202608291015-build-v8-transplant-candidate.yml', 'contracts/202608291015-v8-transplant-plan.json', 'contracts/202608291015-v8-layer-config.json', 'contracts/202608291015-v8-runtime-dependencies.json', 'contracts/202608291015-repository-boundary.json', 'contracts/202608290904-v8-dependency-ledger.json', 'contracts/202608290904-v8-file-ledger.json', 'contracts/202608290904-v8-quarantine.json', 'schemas/202608291015-v8-transplant-parquet.json', 'compiler/202608291015-build-v8-transplant.py', 'atman/202608291015-verify-v8-transplant.py', 'requirements.lock') }}

      - name: Fetch only exact pinned phase inputs
        run: |
          python compiler/202608291015-build-v8-transplant.py \
            --repository . \
            --phase "${{ matrix.phase }}" \
            --source-root work/v8-input \
            --fetch-only

      - name: Deterministic phase builds A and B
        if: steps.phase_cache.outputs.cache-hit != 'true'
        run: |
          python compiler/202608291015-build-v8-transplant.py \
            --repository . --phase "${{ matrix.phase }}" \
            --source-root work/v8-input --output "build-cache/${{ matrix.phase }}"
          python compiler/202608291015-build-v8-transplant.py \
            --repository . --phase "${{ matrix.phase }}" \
            --source-root work/v8-input --output "build-b/${{ matrix.phase }}"
          mkdir -p "build-evidence/${{ matrix.phase }}"
          (cd "build-cache/${{ matrix.phase }}" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "build-evidence/${{ matrix.phase }}/build-a.sha256"
          (cd "build-b/${{ matrix.phase }}" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "build-evidence/${{ matrix.phase }}/build-b.sha256"
          diff --unified "build-evidence/${{ matrix.phase }}/build-a.sha256" "build-evidence/${{ matrix.phase }}/build-b.sha256"

      - name: Independently verify phase cache or fresh build
        run: |
          mkdir -p work
          test -s "build-evidence/${{ matrix.phase }}/build-a.sha256"
          test -s "build-evidence/${{ matrix.phase }}/build-b.sha256"
          diff --unified "build-evidence/${{ matrix.phase }}/build-a.sha256" "build-evidence/${{ matrix.phase }}/build-b.sha256"
          (cd "build-cache/${{ matrix.phase }}" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "work/${{ matrix.phase }}-current.sha256"
          diff --unified "build-evidence/${{ matrix.phase }}/build-a.sha256" "work/${{ matrix.phase }}-current.sha256"
          python atman/202608291015-verify-v8-transplant.py \
            --repository . \
            --phase-output "build-cache/${{ matrix.phase }}" \
            --source-root work/v8-input \
            --output "work/${{ matrix.phase }}-verification.json"

      - name: Upload exact verified phase
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v8-transplant-202608291015-payload-phase-${{ matrix.phase }}
          path: build-cache/${{ matrix.phase }}/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload retained A/B and independent phase proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v8-transplant-202608291015-proof-phase-${{ matrix.phase }}
          path: |
            build-evidence/${{ matrix.phase }}/
            work/${{ matrix.phase }}-verification.json
            work/${{ matrix.phase }}-current.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  merge_verify:
    name: Merge and independently verify full V8 candidate
    needs: build_phase
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_source_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Reassert exact main source
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha || github.sha }}
          EXECUTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$EXECUTED_WORKFLOW_SHA" = "$EXPECTED_SOURCE_SHA"
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SOURCE_SHA"

      - name: Configure pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'

      - name: Install locked analytical engine
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Download all eight verified phase artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: v8-transplant-202608291015-payload-phase-*
          path: work/phase-artifacts
          merge-multiple: true

      - name: Download all retained phase proofs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: v8-transplant-202608291015-proof-phase-*
          path: work/phase-proofs
          merge-multiple: true

      - name: Verify retained phase proof closure
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          phases = {
              'p1_foundation', 'p2_lazy_context', 'p3_official_rebuild', 'p4_rail_global',
              'p4_motorways', 'p4_trunk_roads', 'p4_primary_roads', 'quarantine',
          }
          root = Path('work/phase-proofs')
          source_commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          proofs = {}
          evidence = []
          for path in sorted(item for item in root.rglob('*') if item.is_file()):
              payload = path.read_bytes()
              evidence.append({'path': path.relative_to(root).as_posix(), 'bytes': len(payload), 'sha256': hashlib.sha256(payload).hexdigest()})
              if path.name.endswith('-verification.json'):
                  phase = path.name.removesuffix('-verification.json')
                  proof = json.loads(payload)
                  if proof.get('classification') != 'VERIFIED_V8_TRANSPLANT_PHASE' or proof.get('failed') != 0:
                      raise SystemExit(f'rejected phase proof: {path}')
                  if proof.get('repository_source_commit') != source_commit:
                      raise SystemExit(f'stale phase proof: {path}')
                  proofs[phase] = proof
          if set(proofs) != phases:
              raise SystemExit(f'phase proof closure mismatch: {sorted(proofs)}')
          for phase in phases:
              a = next(root.rglob(f'{phase}/build-a.sha256'))
              b = next(root.rglob(f'{phase}/build-b.sha256'))
              current = next(root.rglob(f'{phase}-current.sha256'))
              if not (a.read_bytes() == b.read_bytes() == current.read_bytes()):
                  raise SystemExit(f'non-deterministic retained proof: {phase}')
              for line in a.read_text(encoding='utf-8').splitlines():
                  expected_hash, relative = line.split(maxsplit=1)
                  relative = relative.lstrip('*')
                  if relative.startswith('./'):
                      relative = relative[2:]
                  target = Path('work/phase-artifacts') / relative
                  if not target.is_file() or hashlib.sha256(target.read_bytes()).hexdigest() != expected_hash:
                      raise SystemExit(f'phase payload/checksum mismatch: {phase}:{relative}')
          Path('work/phase-evidence-index.json').write_text(
              json.dumps({'schema': 'data-gridatlas.phase-evidence-index.v1', 'generation': '202608291015', 'files': evidence}, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Deterministically merge full candidate
        run: |
          python compiler/202608291015-build-v8-transplant.py \
            --repository . \
            --merge-input work/phase-artifacts \
            --output candidate

      - name: Independent full closure verification
        id: atman
        continue-on-error: true
        run: |
          mkdir -p work
          set -o pipefail
          python atman/202608291015-verify-v8-transplant.py \
            --repository . \
            --candidate candidate \
            --phase-input work/phase-artifacts \
            --output work/full-candidate-verification.json \
            2>&1 | tee work/full-candidate-verification.log

      - name: Final compare-and-swap boundary
        id: final_cas
        continue-on-error: true
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha || github.sha }}
          EXECUTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$EXECUTED_WORKFLOW_SHA" = "$EXPECTED_SOURCE_SHA"
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SOURCE_SHA"

      - name: Upload full V8 transplant candidate and proof
        if: steps.atman.outcome == 'success' && steps.final_cas.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: data-gridatlas-202608291015-verified-candidate-${{ inputs.expected_source_sha || github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            candidate/
            work/full-candidate-verification.json
            work/full-candidate-verification.log
            work/phase-evidence-index.json
            work/phase-proofs/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload explicitly rejected evidence only
        if: always() && (steps.atman.outcome != 'success' || steps.final_cas.outcome != 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: REJECTED-data-gridatlas-202608291015-${{ inputs.expected_source_sha || github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            work/full-candidate-verification.json
            work/full-candidate-verification.log
            work/phase-evidence-index.json
            work/phase-proofs/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Post-upload compare-and-swap receipt
        id: post_upload_cas
        if: steps.atman.outcome == 'success' && steps.final_cas.outcome == 'success'
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha || github.sha }}
          EXECUTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          test "$EXECUTED_WORKFLOW_SHA" = "$EXPECTED_SOURCE_SHA"
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SOURCE_SHA"

      - name: Enforce full candidate classification
        if: always()
        env:
          ATMAN_OUTCOME: ${{ steps.atman.outcome }}
          FINAL_CAS_OUTCOME: ${{ steps.final_cas.outcome }}
          POST_UPLOAD_CAS_OUTCOME: ${{ steps.post_upload_cas.outcome }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(Path('work/full-candidate-verification.json').read_text(encoding='utf-8'))
          if proof.get('classification') != 'VERIFIED_FULL_V8_TRANSPLANT_CANDIDATE' or proof.get('failed') != 0:
              raise SystemExit(f"full V8 transplant candidate rejected: {proof}")
          PY
          test "$ATMAN_OUTCOME" = "success"
          test "$FINAL_CAS_OUTCOME" = "success"
          test "$POST_UPLOAD_CAS_OUTCOME" = "success"
