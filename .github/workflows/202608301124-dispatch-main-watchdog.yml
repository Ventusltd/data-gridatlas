name: 202608301124 Dispatch repaired data-gridatlas watchdog
run-name: Dispatch main watchdog after consumer repair from ${{ github.sha }}

on:
  push:
    branches:
      - 'ci/202608301102-consumer-pointer-watchdog-repair'
    paths:
      - '.github/workflows/202608301124-dispatch-main-watchdog.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch existing hourly watchdog on current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/202608291507-watchdog-router.yml/dispatches" \
            -d '{"ref":"main"}'
