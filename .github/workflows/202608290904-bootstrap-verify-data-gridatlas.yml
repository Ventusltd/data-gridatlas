name: 202608290904 Bootstrap verify data-gridatlas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/202608290904-bootstrap-verify-data-gridatlas.yml'
      - '.gitignore'
      - 'README.md'
      - 'requirements.lock'
      - 'contracts/**'
      - 'compiler/202608290904-build-dependency-catalog.py'
      - 'atman/202608290904-verify-bootstrap.py'
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact source commit to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: data-gridatlas-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap_verify:
    name: Double-build and verify dependency catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_source_sha || github.sha }}
          fetch-depth: 2

      - name: Enforce compare-and-swap source boundary
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha || github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Configure pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install locked analytical engine
        run: python -m pip install --disable-pip-version-check -r requirements.lock

      - name: Verify inventory-only source boundary
        run: |
          mkdir -p work
          python atman/202608290904-verify-bootstrap.py \
            --repository . \
            --output work/source-boundary.json

      - name: Fetch pinned V8 tree metadata without payload blobs
        run: |
          git init work/v8-oracle
          git -C work/v8-oracle remote add origin https://github.com/Ventusltd/globalgrid2050.git
          git -C work/v8-oracle -c protocol.version=2 fetch \
            --filter=blob:none --no-tags --depth=1 origin \
            f2f343a92ee972cc74ed23b4b99d8a22896791ad
          test "$(git -C work/v8-oracle rev-parse FETCH_HEAD)" = "f2f343a92ee972cc74ed23b4b99d8a22896791ad"
          test "$(git -C work/v8-oracle rev-parse 'FETCH_HEAD^{tree}')" = "2a8ecce66fdb06fbeac1d58443b2d67ba17aedb9"
          {
            git -C work/v8-oracle ls-tree -r FETCH_HEAD repd_grid_atlasv8
            git -C work/v8-oracle ls-tree FETCH_HEAD -- \
              uk_metros_trams.geojson \
              uk_mainline_railways.geojson \
              uk_motorways.geojson \
              uk_trunk_roads.geojson \
              uk_primary_roads.geojson \
              heavy_emitters_uk.json \
              dist/repd_master.json
          } > work/v8-tree.txt

      - name: Verify exact pinned V8 path and blob closure
        run: |
          python atman/202608290904-verify-bootstrap.py \
            --repository . \
            --oracle-tree work/v8-tree.txt \
            --output work/oracle-verification.json

      - name: Deterministic clean catalogue builds A and B
        run: |
          python compiler/202608290904-build-dependency-catalog.py --repository . --output build-a
          python compiler/202608290904-build-dependency-catalog.py --repository . --output build-b
          (cd build-a && find . -type f -print0 | sort -z | xargs -0 sha256sum) > work/build-a.sha256
          (cd build-b && find . -type f -print0 | sort -z | xargs -0 sha256sum) > work/build-b.sha256
          diff --unified work/build-a.sha256 work/build-b.sha256

      - name: Independent DuckDB typed and quarantine verification
        id: atman
        continue-on-error: true
        run: |
          python atman/202608290904-verify-bootstrap.py \
            --repository . \
            --oracle-tree work/v8-tree.txt \
            --catalog build-a \
            --output work/bootstrap-verification.json

      - name: Upload exact bootstrap evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-gridatlas-202608290904-bootstrap-candidate
          path: |
            build-a/
            work/build-a.sha256
            work/build-b.sha256
            work/source-boundary.json
            work/oracle-verification.json
            work/bootstrap-verification.json
            work/v8-tree.txt
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Enforce verified bootstrap candidate classification
        if: always()
        env:
          ATMAN_OUTCOME: ${{ steps.atman.outcome }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          proof = json.loads(Path('work/bootstrap-verification.json').read_text(encoding='utf-8'))
          if proof.get('classification') != 'VERIFIED_BOOTSTRAP_CANDIDATE' or proof.get('failed') != 0:
              raise SystemExit(f"bootstrap candidate rejected: {proof}")
          PY
          test "$ATMAN_OUTCOME" = "success"
